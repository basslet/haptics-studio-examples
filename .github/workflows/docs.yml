name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Check links and navigation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Needs only the checkout and Node: no install.
      - name: Check documentation links and navigation
        run: node scripts/check_doc_links.js && node --test scripts/*.test.js
